<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smol-ui</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2.5V5.5'/><path d='M7.5 11C7.5 7.8 9.4 5.5 12 5.5C14.6 5.5 16.5 7.8 16.5 11C16.5 12.6 15.4 13.5 13.8 13.5H10.2C8.6 13.5 7.5 12.6 7.5 11Z'/><circle cx='10.4' cy='10.2' r='0.9' fill='currentColor' stroke='none'/><circle cx='13.6' cy='10.2' r='0.9' fill='currentColor' stroke='none'/><path d='M9.5 13.5C9.5 16.5 6 16.5 6 19.5'/><path d='M12 13.5V19.5'/><path d='M14.5 13.5C14.5 16.5 18 16.5 18 19.5'/><circle cx='6' cy='21' r='1.4' fill='currentColor' stroke='none'/><circle cx='12' cy='21' r='1.4' fill='currentColor' stroke='none'/><circle cx='18' cy='21' r='1.4' fill='currentColor' stroke='none'/></svg>">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-800">
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <svg class="w-6 h-6 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5V5.5"/><path d="M7.5 11C7.5 7.8 9.4 5.5 12 5.5C14.6 5.5 16.5 7.8 16.5 11C16.5 12.6 15.4 13.5 13.8 13.5H10.2C8.6 13.5 7.5 12.6 7.5 11Z"/><circle cx="10.4" cy="10.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="13.6" cy="10.2" r="0.9" fill="currentColor" stroke="none"/><path d="M9.5 13.5C9.5 16.5 6 16.5 6 19.5"/><path d="M12 13.5V19.5"/><path d="M14.5 13.5C14.5 16.5 18 16.5 18 19.5"/><circle cx="6" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="21" r="1.4" fill="currentColor" stroke="none"/></svg>
                    <span>smol-ui</span>
                </h1>
                <p class="text-xs text-gray-500 mt-1">smol-llm-proxy Manager</p>
            </div>
            <nav class="flex-1 p-3 space-y-1">
                <a href="/" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" data-page="dashboard">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/keys" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" data-page="keys">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                    API Keys
                </a>
                <a href="/servers" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" data-page="servers">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
                    Servers
                </a>
                <a href="/aliases" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" data-page="aliases">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                    Aliases
                </a>
                <a href="/usage" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" data-page="usage">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    Usage
                </a>
            </nav>
            <div class="p-3 border-t border-gray-800">
                <div id="proxy-status" class="flex items-center gap-2 text-xs text-gray-500">
                    <span class="w-2 h-2 rounded-full bg-gray-600"></span>
                    Checking...
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">
            <div class="p-6 max-w-6xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeModal()"></div>
    <div id="modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-900 border border-gray-700 rounded-xl p-6 z-50 hidden w-full max-w-md shadow-2xl">
        <div id="modal-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
