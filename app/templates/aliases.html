{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold">Aliases</h2>
            <p class="text-gray-400 mt-1">Short names that map to model names</p>
        </div>
        <button onclick="openCreateAliasModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-medium transition-colors">
            + New Alias
        </button>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-800 text-left text-xs text-gray-400 uppercase tracking-wider">
                    <th class="px-5 py-3">Alias</th>
                    <th class="px-5 py-3">Model</th>
                    <th class="px-5 py-3 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="aliases-table-body" class="text-sm">
                <tr><td colspan="3" class="px-5 py-8 text-center text-gray-500">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showDeleteAliasModal(name) {
    const content = `
        <div class="space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center">
                    <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                </div>
                <div>
                    <h3 class="text-lg font-semibold">Delete Alias?</h3>
                    <p class="text-sm text-gray-400 mt-0.5">You are about to delete <strong>${name}</strong>. This cannot be undone.</p>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
                <button id="confirm-delete-alias-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-sm font-medium transition-colors">
                    Delete
                </button>
            </div>
        </div>
    `;
    showModal(content);
    setTimeout(() => {
        const btn = document.getElementById('confirm-delete-alias-btn');
        if (btn) {
            btn.addEventListener('click', async () => {
                closeModal();
                const ok = await apiFetch(`/api/aliases/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (ok !== null) {
                    loadAliases();
                    showToast('Alias deleted', 'success');
                }
            });
        }
    }, 50);
}

function openCreateAliasModal() {
    const content = `
        <div class="space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                </div>
                <h3 class="text-lg font-semibold">Create Alias</h3>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-gray-400">Alias Name</label>
                    <input id="alias-name" type="text" placeholder="fast" class="w-full mt-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="text-sm text-gray-400">Model Name</label>
                    <input id="alias-model" type="text" placeholder="qwen3-30b-a3b-instruct.gguf" class="w-full mt-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
                <button id="create-alias-btn" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-medium transition-colors">Create</button>
            </div>
        </div>
    `;
    showModal(content);
    setTimeout(() => {
        document.getElementById('alias-name')?.focus();
        const btn = document.getElementById('create-alias-btn');
        if (btn) {
            btn.addEventListener('click', () => {
                const name = document.getElementById('alias-name').value.trim();
                const realModel = document.getElementById('alias-model').value.trim();
                if (!name || !realModel) { showToast('Name and model are required', 'error'); return; }
                apiFetch('/api/aliases', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, real_model_name: realModel })
                }).then(ok => {
                    if (ok !== null) {
                        closeModal();
                        loadAliases();
                        showToast('Alias created', 'success');
                    }
                });
            });
        }
    }, 50);
}

function openEditAliasModal(alias) {
    const content = `
        <div class="space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </div>
                <div>
                    <h3 class="text-lg font-semibold">Edit Alias</h3>
                    <p class="text-sm text-gray-400 mt-0.5">Updating <strong>${alias.alias_name}</strong></p>
                </div>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-gray-400">Model Name</label>
                    <input id="edit-alias-model" type="text" value="${alias.real_model_name}" class="w-full mt-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
                <button id="update-alias-btn" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-medium transition-colors">Update</button>
            </div>
        </div>
    `;
    showModal(content);
    setTimeout(() => {
        const btn = document.getElementById('update-alias-btn');
        if (btn) {
            btn.addEventListener('click', () => {
                const realModel = document.getElementById('edit-alias-model').value.trim();
                if (!realModel) { showToast('Model name is required', 'error'); return; }
                apiFetch(`/api/aliases/${encodeURIComponent(alias.alias_name)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ real_model_name: realModel })
                }).then(ok => {
                    if (ok !== null) {
                        closeModal();
                        loadAliases();
                        showToast('Alias updated', 'success');
                    }
                });
            });
        }
    }, 50);
}

async function loadAliases() {
    const tbody = document.getElementById('aliases-table-body');
    const aliases = await apiFetch('/api/aliases');
    if (aliases === null) {
        tbody.innerHTML = '<tr><td colspan="3" class="px-5 py-8 text-center text-red-400">Failed to load aliases</td></tr>';
        return;
    }
    if (!aliases.length) {
            tbody.innerHTML = '<tr><td colspan="3" class="px-5 py-8 text-center text-gray-500">No aliases yet.</td></tr>';
            return;
        }
        tbody.innerHTML = aliases.map(a => `
                <tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
                <td class="px-5 py-3 font-semibold text-purple-400">${a.alias_name}</td>
                <td class="px-5 py-3 font-mono text-xs text-gray-400">${a.real_model_name}</td>
                <td class="px-5 py-3 text-right space-x-2">
                    <button onclick="openEditAliasModal(aliases.find(x => x.alias_name === '${a.alias_name}'))" class="text-sm text-gray-400 hover:text-white transition-colors" title="Edit">
                        <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button onclick="showDeleteAliasModal('${a.alias_name}')" class="text-sm text-red-400 hover:text-red-300 transition-colors" title="Delete">
                        <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </td>
            </tr>
        `).join('');
}

document.addEventListener('DOMContentLoaded', loadAliases);
</script>
{% endblock %}
